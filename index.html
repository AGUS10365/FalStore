<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLASS SEAT SPINNER</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05091a;--tx:#eef3ff;--mu:#8b97bd;--ln:rgba(255,255,255,.08);
  --gl:rgba(255,255,255,.04);--gl2:rgba(255,255,255,.07);
  --ac:#3b82f6;--ac2:#60a5fa;--er:#fb7185;--ok:#34d399;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100vh;
  font:400 15px/1.55 Poppins,system-ui,sans-serif;color:var(--tx);
  background:
    radial-gradient(1000px 600px at 5% -15%,#1e40af55,transparent 60%),
    radial-gradient(800px 600px at 100% 0%,#0e2a6b66,transparent 55%),
    radial-gradient(600px 500px at 50% 120%,#1d4ed422,transparent 60%),
    var(--bg);
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h2,h3{margin:0 0 6px}h3{font-size:16px;letter-spacing:-.01em}
.g{
  background:linear-gradient(160deg,var(--gl2),var(--gl));
  border:1px solid var(--ln);border-radius:22px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 40px -24px rgba(0,0,0,.6);
}
.b{
  position:relative;overflow:hidden;padding:.65em 1.15em;border-radius:12px;
  border:1px solid var(--ln);background:var(--gl2);color:inherit;
  font:600 14px Poppins,sans-serif;cursor:pointer;
  transition:transform .15s,background .2s,border-color .2s;
}
.b:hover{transform:translateY(-1px);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16)}
.b:active{transform:scale(.97)}
.b.p{background:linear-gradient(135deg,var(--ac),#1d4ed8);border:0;box-shadow:0 10px 24px -10px var(--ac)}
.b:disabled{opacity:.4;pointer-events:none}
.b::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s}
.b:hover::after{transform:translateX(120%)}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
.big{padding:.85em 1.6em;font-size:16px}
.in{
  width:100%;padding:12px 14px;border-radius:12px;
  border:1px solid var(--ln);background:rgba(0,0,0,.32);color:inherit;
  font:inherit;transition:border-color .2s,box-shadow .2s;
}
.in:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
select.in option{background:#0b1430}
.mu{color:var(--mu)}.s{font-size:12px}.er{color:var(--er);min-height:1.3em;margin:0;font-size:13px}

/* ===== LOGIN ===== */
.lg{display:grid;grid-template-columns:1.05fr .95fr;min-height:100vh}
.hr{
  padding:6vw;display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden;
}
.hr::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(600px 400px at 20% 30%,rgba(59,130,246,.25),transparent 70%);
}
.hr h1{
  font-size:clamp(36px,5.2vw,68px);line-height:1.02;margin:0 0 16px;
  font-weight:800;position:relative;letter-spacing:-.02em;
  background:linear-gradient(180deg,#fff,#9db4ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hr p{color:var(--mu);max-width:26em;position:relative;font-size:16px}
.hr .badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.3);font-size:12px;font-weight:600;color:#93c5fd;margin-bottom:18px;position:relative;width:fit-content}
.fl i{
  position:absolute;font-style:normal;font-size:30px;padding:12px;border-radius:16px;
  background:var(--gl2);border:1px solid var(--ln);
  animation:fy 7s ease-in-out infinite;opacity:.9;
}
.cw{display:grid;place-items:center;padding:24px}
.lc{
  width:min(420px,100%);padding:32px;display:grid;gap:16px;
  animation:sp .6s cubic-bezier(.2,1.2,.4,1);
}
.lc .av{
  width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:32px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 35%,transparent),color-mix(in srgb,var(--ac) 12%,transparent));
  border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);
}
.lc h2{font-size:22px;letter-spacing:-.01em}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border-radius:14px;background:rgba(0,0,0,.32);border:1px solid var(--ln)}
.seg button{
  border:0;border-radius:10px;padding:9px 4px;background:none;color:var(--mu);
  font:600 12px Poppins,sans-serif;cursor:pointer;transition:.25s;
}
.seg [aria-pressed=true]{background:linear-gradient(135deg,var(--ac),#1d4ed8);color:#fff;box-shadow:0 6px 16px -6px var(--ac)}
.lfld{display:grid;gap:6px}
.lfld label{font-size:12px;font-weight:600;color:var(--mu);letter-spacing:.02em}

/* ===== APP SHELL ===== */
.hd{
  display:flex;align-items:center;gap:10px;padding:10px 14px;margin:12px;
  position:sticky;top:calc(12px + env(safe-area-inset-top,0px));z-index:20;
  background:linear-gradient(160deg,rgba(20,32,70,.85),rgba(10,18,41,.85));
}
.lo{font-weight:800;letter-spacing:.02em;white-space:nowrap;font-size:14px;background:linear-gradient(90deg,#fff,#93c5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:6px;flex:1;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav .b{white-space:nowrap;padding:8px 14px}
nav .b[aria-pressed=true]{background:linear-gradient(135deg,var(--ac),#1d4ed8);border-color:transparent;box-shadow:0 8px 20px -8px var(--ac)}
.rb{
  padding:7px 14px;border-radius:99px;background:color-mix(in srgb,var(--ac) 18%,transparent);
  border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);
  font-size:13px;font-weight:600;white-space:nowrap;
}
.pgm{max-width:1180px;margin:0 auto;padding:0 14px 60px}
.nt{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25)}

/* ===== SPIN LAYOUT ===== */
.sp{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.pad{padding:22px}
.wc{padding:24px;display:grid;gap:20px}
.wh{position:relative;width:min(100%,520px);aspect-ratio:1;margin:auto}
canvas{width:100%;height:100%;display:block}
.pt{position:absolute;top:-8px;left:50%;transform:translateX(-50%);border:13px solid transparent;border-top:26px solid #fff;border-bottom:0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.ctl,.row{display:flex;gap:8px;flex-wrap:wrap}
.ctl{justify-content:center}.row{margin:12px 0}

/* ===== STATS ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{
  padding:14px;border-radius:14px;background:rgba(255,255,255,.03);
  border:1px solid var(--ln);transition:border-color .2s;
}
.stat:hover{border-color:rgba(59,130,246,.35)}
.stat .v{font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.stat .l{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.stat.a .v{color:var(--ac2)}.stat.g .v{color:var(--ok)}

.pr{height:10px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.pr i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#60a5fa);transition:width .6s;box-shadow:0 0 16px rgba(59,130,246,.6)}

.hi{
  padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);
  margin:6px 0;font-size:14px;animation:fi .3s;border:1px solid transparent;
  transition:border-color .2s;
}
.hi:hover{border-color:rgba(59,130,246,.3)}
.hi b{color:var(--ac2)}

/* ===== SISWA / AKUN ===== */
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.li .in{flex:1}
.ls{max-height:50vh;overflow:auto;margin-top:12px;padding-right:4px}
.fm{display:grid;gap:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar .row{margin:0}
.acc{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.03);
  margin:6px 0;border:1px solid var(--ln);
}

/* ===== DENAH ===== */
.board{
  margin:14px 0;padding:12px;text-align:center;border-radius:12px;
  background:linear-gradient(180deg,rgba(59,130,246,.14),rgba(59,130,246,.06));
  border:1px solid rgba(59,130,246,.25);
  font-size:12px;letter-spacing:.25em;font-weight:600;color:#93c5fd;
}
.dn{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tb{
  padding:12px;border-radius:16px;border:1px solid var(--ln);
  background:rgba(255,255,255,.03);transition:transform .25s,border-color .25s;
  min-width:0;
}
.tb:hover{transform:translateY(-4px);border-color:var(--ac)}
.tb.f{border-color:rgba(59,130,246,.5);background:linear-gradient(160deg,rgba(59,130,246,.18),rgba(255,255,255,.03))}
.tb.hl{animation:hl 2.4s ease}
.tb b{font-size:12px;color:var(--mu);letter-spacing:.03em}
.st{display:flex;align-items:center;gap:8px;margin-top:8px;padding:7px 8px;border-radius:10px;font-size:13px;min-height:38px}
.st i{font-style:normal;font-weight:700;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;flex:none}
.st span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sa{background:rgba(59,130,246,.15)}.sa i{background:#3b82f6}
.sb{background:rgba(56,189,248,.12)}.sb i{background:#0ea5e9}
.st .e{color:var(--mu);font-style:italic}

/* ===== POPUP ===== */
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(3,6,18,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:50;animation:fi .2s}
.sh{
  width:min(420px,92vw);
  background:linear-gradient(180deg,#17284f,#0b1430);
  border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:30px;
  text-align:center;animation:sp .55s cubic-bezier(.2,1.3,.4,1);
  display:grid;gap:10px;box-shadow:0 40px 80px -20px rgba(0,0,0,.7);
}
.sh h2{font-size:28px;line-height:1.15;margin:0;word-break:break-word;letter-spacing:-.01em}
.sh p{margin:0;color:var(--mu)}
.em{font-size:48px;animation:bn 2s ease-in-out infinite}
.tk{border-top:2px dashed rgba(255,255,255,.12);margin:12px -30px 0;padding-top:14px;color:var(--mu)}

/* ===== UTIL ===== */
.sk{border-radius:12px;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.1) 50%,transparent 70%) 0 0/200% 100%,rgba(255,255,255,.05);animation:sh 1.2s linear infinite}
#toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,16px);background:#eef3ff;color:#05091a;
  padding:11px 20px;border-radius:99px;font-weight:600;font-size:14px;
  opacity:0;transition:.25s;z-index:70;pointer-events:none;max-width:92vw;text-align:center;
  box-shadow:0 20px 40px -12px rgba(0,0,0,.5);
}
#toast.on{opacity:1;transform:translate(-50%,0)}

@keyframes rp{to{transform:scale(4);opacity:0}}
@keyframes fi{from{opacity:0}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes sp{from{opacity:0;transform:translateY(60px) rotate(-3deg) scale(.9)}}
@keyframes bn{50%{transform:translateY(-6px) rotate(-4deg)}}
@keyframes fy{50%{transform:translateY(-22px) rotate(8deg)}}
@keyframes hl{0%{transform:scale(.94);box-shadow:0 0 0 0 rgba(96,165,250,.7)}40%{transform:scale(1.05);box-shadow:0 0 0 12px rgba(96,165,250,0)}}

@media (max-width:900px){
  .sp,.lg{grid-template-columns:1fr}
  .hr{display:none}
  .lo{display:none}
}
@media (max-width:560px){
  .dn{gap:8px}.tb{padding:9px}
  .st{font-size:11px;padding:5px;gap:5px}
  .pad{padding:16px}.wc{padding:18px}
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat:last-child{grid-column:span 2}
  .rb{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  /* ===== BANNER POPUP ===== */
.bn-box{
  position:fixed; inset:0; display:grid; place-items:center; z-index:100;
  background:rgba(3,6,18,.8); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  animation:fi .3s; padding:20px;
}
.bn-card{
  width:min(480px,100%); background:linear-gradient(145deg, rgba(30,58,138,.95), rgba(17,24,39,.98));
  border:1px solid rgba(255,255,255,.15); border-radius:28px; padding:32px;
  text-align:center; box-shadow:0 40px 100px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.05) inset;
  animation:sp .6s cubic-bezier(.2,1.3,.4,1); position:relative; overflow:hidden;
}
.bn-card::before{
  content:""; position:absolute; top:-50%; left:-50%; width:200%; height:200%;
  background:radial-gradient(circle at center, rgba(59,130,246,.2), transparent 60%);
  pointer-events:none;
}
.bn-icon{ font-size:56px; margin-bottom:12px; display:inline-block; animation:bn 2.5s ease-in-out infinite; }
.bn-title{ font-size:26px; font-weight:800; line-height:1.2; margin:0 0 10px; color:#fff; letter-spacing:-.02em; }
.bn-desc{ font-size:15px; color:#93c5fd; line-height:1.6; margin:0 0 24px; white-space:pre-wrap; }
.bn-btn{ width:100%; padding:14px; font-size:16px; border-radius:14px; }
</style>

<div id="app"></div><div id="mod"></div><div id="toast" role="status" aria-live="polite"></div>

<!-- FIREBASE COMPAT SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDQwwgvic_FAefgxi5TDRWsNXzH3ewlQNo",
  authDomain: "clase-cbd9b.firebaseapp.com",
  databaseURL: "https://clase-cbd9b-default-rtdb.asia-southeast1.firebasedatabase.app",

  appId: "1:475871117428:web:41544eb142073be01a1121"
};
firebase.initializeApp(firebaseConfig);
const dbRef = firebase.database().ref('kelas/state');

// --- LOGIKA APLIKASI ---
const $=(s,r=document)=>r.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=42,RL={user:['Siswa','🎓','#38bdf8'],admin:['Admin','🧑‍🏫','#3b82f6'],dev:['Developer','🛠️','#818cf8']},PG={spin:'🎡 Spin',denah:'🪑 Denah',siswa:'👥 Siswa',akun:'🔐 Akun'};
const DEV={u:'developer',nm:'Developer',p:'dev123',r:'dev'};
const norm=d=>({students:d?.students||[],seats:(d?.seats||[]).concat(Array(N).fill('')).slice(0,N),hist:d?.hist||[],akun:d?.akun||[]});
let S=norm(),me=null,pg='spin',ready=false,mode='',busy=false,dirty=0,auto='',ang=0,muted=false,lr='user',snd=null,askFn=null,regMode=false;
const sl=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>{const a=new Uint32Array(1),m=Math.floor(2**32/n)*n;do crypto.getRandomValues(a);while(a[0]>=m);return a[0]%n};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const left=()=>{const s=new Set(S.seats);return S.students.filter(n=>!s.has(n))},filled=()=>S.seats.filter(Boolean).length;
const H=async p=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('kss:'+p)))].map(x=>x.toString(16).padStart(2,'0')).join('');

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2800)}
function save(){dbRef.set(S).catch(()=>toast('⚠️ Gagal simpan ke server'))}

/* suara */
const ac=()=>snd||(snd=new(window.AudioContext||window.webkitAudioContext)());
function tone(f,d,v=.04,t='sine',s=0){if(muted)return;try{const c=ac(),o=c.createOscillator(),g=c.createGain(),T=c.currentTime+s;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.connect(g).connect(c.destination);o.start(T);o.stop(T+d)}catch(e){}}
const tick=()=>tone(700,.04,.03,'square'),chime=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,.06,'triangle',i*.09));

/* popup */
function pop(h,ms,foot){$('#mod').innerHTML=`<div class="ov" data-a="cm"><div class="sh">${h}${foot??(ms?'':'<button class="b p" data-a="cm">Lanjut</button>')}</div></div>`;if(ms)setTimeout(()=>{if($('#mod .sh'))A.cm()},ms)}
const ask=(t,m,ok,fn)=>{askFn=fn;pop(`<div class="em">🤔</div><h2>${t}</h2><p>${m}</p>`,0,`<div class="row" style="justify-content:center"><button class="b" data-a="cm">Batal</button><button class="b p" data-a="yes">${ok}</button></div>`)};
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.createElement('canvas'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:80';document.body.append(c);const cl=['#3b82f6','#60a5fa','#fff','#1d4ed8','#93c5fd'],p=[...Array(120)].map(()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*14-3,s:5+Math.random()*6,c:cl[Math.floor(Math.random()*5)],r:Math.random()*6}));let f=0;(function t(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.vy+=.35;q.x+=q.vx;q.y+=q.vy;q.r+=.2;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.s/2,-q.s/2,q.s,q.s*.6);x.restore()});++f<130?requestAnimationFrame(t):c.remove()})()}

/* tampilan */
const skel=()=>`<div class="lg"><div class="hr"><div class="sk" style="height:64px;width:70%"></div><div class="sk" style="height:20px;width:50%;margin-top:14px"></div></div><div class="cw"><div class="g lc"><div class="sk" style="height:68px;width:68px"></div><div class="sk" style="height:28px"></div><div class="sk" style="height:46px"></div><div class="sk" style="height:46px"></div><div class="sk" style="height:46px"></div></div></div></div>`;

function login(){
  const R=RL[lr],D={user:'Masuk atau daftar untuk melihat denah kelas.',admin:'Khusus admin kelas. Akun dibuat oleh Developer.',dev:'Akses penuh sistem. Hanya untuk Developer.'};
  const reg=lr==='user'&&regMode;
  return `<div class="lg" style="--ac:${R[2]}">
    <div class="hr">
      <div class="fl">${[...'🪑🎡🎓📚✏️🏫'].map((e,i)=>`<i style="top:${8+i*15}%;left:${(i*31)%68+4}%;animation-delay:-${i}s">${e}</i>`).join('')}</div>
      <span class="badge">✨ Seating chart generator</span>
      <h1>CLASS<br>SEAT SPINNER</h1>
      <p>Acak tempat duduk kelas dengan adil, otomatis, dan seru. Cukup satu klik — biar roda yang memilih.</p>
    </div>
    <div class="cw">
      <form class="g lc" id="lf" data-mode="${reg?'reg':'login'}">
        <div class="av">${reg?'📝':R[1]}</div>
        <div>
          <h2>${reg?'Daftar akun Siswa':'Masuk sebagai '+R[0]}</h2>
          <span class="mu s">${reg?'Buat akun untuk melihat denah kelas.':D[lr]}</span>
        </div>

    <script>
        // Toggle dropdown menu
        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        
        menuBtn.addEventListener('click', function() {
            dropdownMenu.classList.toggle('show');
        });
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            if (!menuBtn.contains(event.target) && !dropdownMenu.contains(event.target)) {
                dropdownMenu.classList.remove('show');
            }
        });
        
        // Switch sections
        const sections = document.querySelectorAll('.section');
        const navLinks = document.querySelectorAll('.dropdown-content a');
        
        navLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                
                // Hide dropdown
                dropdownMenu.classList.remove('show');
                
                // Get target section
                const targetSection = this.getAttribute('data-section');
                
                // Hide all sections
                sections.forEach(section => {
                    section.classList.remove('active');
                });
                
                // Show target section
                document.getElementById(targetSection).classList.add('active');
            });
        });
        
        // Copy to clipboard function
        const copyButtons = document.querySelectorAll('.copy-btn');
        const toast = document.getElementById('toast');
        
        copyButtons.forEach(button => {
            button.addEventListener('click', function() {
                const number = this.getAttribute('data-number');
                
                // Copy to clipboard
                navigator.clipboard.writeText(number).then(() => {
                    // Show toast notification
                    toast.classList.add('show');
                    
                    // Hide toast after 3 seconds
                    setTimeout(() => {
                        toast.classList.remove('show');
                    }, 3000);
                });
            });
        });
        
        // QRIS Modal functionality
        const qrisPlaceholder = document.getElementById('qrisPlaceholder');
        const qrisModal = document.getElementById('qrisModal');
        const closeModal = document.getElementById('closeModal');
        
        qrisPlaceholder.addEventListener('click', function() {
            qrisModal.classList.add('show');
        });
        
        closeModal.addEventListener('click', function() {
            qrisModal.classList.remove('show');
        });
        
        // Close modal when clicking outside
        qrisModal.addEventListener('click', function(e) {
            if (e.target === qrisModal) {
                qrisModal.classList.remove('show');
            }
        });
    </script>
